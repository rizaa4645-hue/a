<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velvet Product Maker</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">

    <div class="controls">

        <h1>Velvet Product Maker</h1>

        <div class="group">
            <label>Background</label>
            <input
                type="file"
                id="backgroundInput"
                accept="image/*">
        </div>

        <div class="group">
            <label>Secondary Image</label>
            <input
                type="file"
                id="secondaryInput"
                accept="image/*">
        </div>

        <div class="group">
            <label>Scale</label>

            <input
                type="range"
                id="scale"
                min="0.1"
                max="3"
                value="1"
                step="0.01">

            <span id="scaleValue">1.00</span>
        </div>

        <div class="row">

            <div class="group">
                <label>X</label>

                <input
                    type="number"
                    id="x"
                    value="0">
            </div>

            <div class="group">
                <label>Y</label>

                <input
                    type="number"
                    id="y"
                    value="0">
            </div>

        </div>

        <div class="buttons">

            <button id="reset">
                Reset
            </button>

            <button id="download">
                Download PNG
            </button>

        </div>

    </div>

    <div class="previewContainer">

        <canvas
    id="preview"
    width="1200"
    height="1200">
        </canvas>

    </div>

</div>

<script src="main.js"></script>

</body>
</html>
